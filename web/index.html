    <svg class="chart" viewBox="0 0 ${BW} ${BH}" role="img" aria-label="The most each path can spend every year">${bars}</svg>${detail}`;
}
// What one path came to, in one line for the panel under the chart.
function pathStatus(p) {
  if (!p) return "";
  const lives = p.lifespans && riskLife() ? " · " + people().map((x, i) => esc(x.name) + " lives to " + p.lifespans[i]).join(", ") : "";
  if (p.solved && p.convergence === "unsolvable iterate") return `<span class="edge">Borderline</span>: the money just about lasts or runs short in these markets, and Owl could not settle which${lives}`;
  if (p.solved) {
    const low = p.timeline.reduce((m, r) => (r.worth < m.worth ? r : m), p.timeline[0]);
    return `Savings left at the end <b class="mono">${money(p.bequest)}</b> · lowest net worth <b class="mono">${money(low.worth)}</b> in ${low.year} · tax over the plan <b class="mono">${money(p.timeline.reduce((t, r) => t + r.tax, 0))}</b>${lives}`;
  }
  if (!p.short) return "Owl could not solve this path";
  return `<span class="short">Ran short</span> ${runoutText(p)}`;
}

// A path's years as the View tab reads a plan: Owl's full yearly numbers, with the scenario's
// spending bands, and prices growing as that path's own inflation did.
function pathRows(p, doc) {
  const full = p && (p.solved ? p.rows : p.runout && p.runout.rows);
  if (!full) return null;
  const inf = (p.returns || []).map((r) => r[4] / 100), inflation = inf.length ? Math.pow(inf.reduce((t, v) => t * (1 + v), 1), 1 / inf.length) - 1 : undefined;
  return rowsOf(Object.assign({}, doc, { result: { timeline: full, inflation } }));
}
// The year card beside the path's chart: the year under the pointer, every line always there.
function pathCard(rows) {
  const yr = rows ? Math.min(Math.max(UI.riskYear, rows[0].year), rows[rows.length - 1].year) : UI.riskYear, r = rows && rows.find((x) => x.year === yr);
  const defs = [["Net worth", "worth", 0], ["Taxable", "taxable", 1], ["Pre-tax", "pretax", 1], ["Roth", "roth", 1], ["Real estate", "re", 1], ["Mortgages", "debt", 1],
    ["Spending", "outflow", 0], ["Tax paid", "tax", 0], ["Roth conversion", "conv", 0], ["Social Security", "ss", 0]];
  return `<div class="pc-year"><b>${yr}</b> <span class="muted small">${people().map((p) => esc(p.name) + " " + (yr - p.born)).join(" · ")}</span></div>
    <table class="detail"><tbody>${defs.map(([label, key, sub]) => `<tr><th class="l ${sub ? "sub" : "top"}">${label}</th><td class="tA">${r ? money(r[key]) : "—"}</td></tr>`).join("")}</tbody></table>`;
}
// The picked path in full, like a plan in View: savings by account or spending by kind, by year.
function pathFull(sel, doc) {
  const rows = pathRows(sel, doc), W = 900, H = 250, L = 58, Rr = 10, T = 8, B = 26, pw = W - L - Rr, ph = H - T - B;
  const LAYERS = UI.stack === "spend" ? SPEND : STACK;
  const head = `<div class="chart-head"><span>${sel ? esc(sel.label) + " in full" : "The picked path in full"} · today's dollars</span>${seg([["worth", "Savings"], ["spend", "Spending"]], "stack")}</div>`;
  const note = !sel ? "Pick a path to see it year by year, as in View."
    : !rows ? (sel.solved ? "This run is from before paths kept every number; run it again to see this path in full."
      : sel.short ? "Find when the money runs out (the button on the chart) to see this path up to its last good year." : "Owl could not solve this path.") : "";
  let svg = "";
  if (rows) {
    const x0 = rows[0].year, x1 = rows[rows.length - 1].year, x = (yr) => L + (yr - x0) * pw / Math.max(1, x1 - x0);
    let ymax = 1; rows.forEach((r) => { ymax = Math.max(ymax, LAYERS.reduce((t, [k]) => t + Math.max(0, r[k]), 0)); });
    const st = niceStep(ymax); ymax = Math.ceil(ymax / st) * st;
    const y = (v) => T + ph * (1 - v / ymax);
    for (let v = 0; v <= ymax + 1e-6; v += st) svg += `<line x1="${L}" x2="${W - Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${v ? "#2a2c31" : "#5a5c62"}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v ? money(v) : "$0"}</text>`;
    let base = rows.map(() => 0);
    LAYERS.forEach(([key, , fill]) => {
      const top = rows.map((r, i) => base[i] + Math.max(0, r[key]));
      svg += `<path d="M${rows.map((r, i) => x(r.year).toFixed(1) + "," + y(top[i]).toFixed(1)).join("L")}L${rows.map((r, i) => x(r.year).toFixed(1) + "," + y(base[i]).toFixed(1)).reverse().join("L")}Z" fill="${fill}" stroke="#17181b" stroke-width="1.5"/>`;
      base = top;
    });
    for (let yr = x0; yr <= x1; yr++) if (yr % 5 === 0) svg += `<text x="${x(yr).toFixed(1)}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
    const cy = Math.min(Math.max(UI.riskYear, x0), x1);
    svg += `<line id="path-cursor" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="#8a8c92" transform="translate(${x(cy).toFixed(1)},0)" pointer-events="none"/>`;
    svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sel.label)}, year by year" data-x0="${x0}" data-x1="${x1}" data-l="${L}" data-pw="${pw}" data-cursor="path-cursor">${svg}</svg>`;
  } else svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="No path picked"></svg>`;
  const legend = LAYERS.map(([, label, fill]) => `<span><span class="chip" style="background:${fill}"></span>${label}</span>`).join("");
  return `<div class="pfull">${head}<div class="legend" style="margin-left:0">${note ? `<span class="muted">${note}</span>` : legend}</div>
    <div class="pfull-body"><div>${svg}</div><aside id="path-card">${pathCard(rows)}</aside></div></div>`;
}

// Savings left: net worth across the paths, as a band or as every path; the picked path's
// markets and numbers in a panel of fixed size underneath, so picking moves nothing.
function riskBody(data, color, plan, result, job) {
  const S = riskStats(data), n = S.paths.length, lasted = S.ok.length;
  const sel = S.paths.find((p) => p.value === UI.riskPath), every = UI.riskView === "paths";
  const tiles = [
    ["Lasted", `${lasted} of ${n}`, [S.short.length && `${S.short.length} ran short`, S.borderline.length && `${S.borderline.length} borderline`, S.stuck.length && `Owl could not solve ${S.stuck.length}`].filter(Boolean).join(" · ") || "Every path paid for everything"],
    ["Savings left, median", money(quantile(S.ends, 0.5)), `Average markets: ${money(result.bequest)}`],
    ["Savings left, P10", money(quantile(S.ends, 0.1)), "90% of lasting paths end above this"],
    ["Lowest net worth on any path", S.low ? money(S.low.worth) : "—", S.low ? `${esc(S.low.path.label)}, in ${S.low.year}` : ""],
  ].map(([t, v, sub]) => `<div class="tile"><div class="muted small">${t}</div><div class="big mono">${v}</div><div class="muted small">${sub}</div></div>`).join("");

  // Net worth, log scale. Axis and scale are set once from every path, so nothing moves on a pick.
  const W = 1200, H = 290, L = 64, Rr = 12, T = 10, B = 28, pw = W - L - Rr, ph = H - T - B;
  const lineOf = (p) => (p.solved ? p.timeline : p.runout && p.runout.timeline) || [];
  const drawn = S.paths.map(lineOf).filter((t) => t.length);
  const yrs = S.bands.length ? S.bands.map((b) => b.year) : drawn.flat().concat(plan).map((r) => r.year);
  const x0 = Math.min(...yrs), x1 = Math.max(...yrs, ...drawn.map((t) => t[t.length - 1].year));
  const x = (yr) => L + (yr - x0) * pw / Math.max(1, x1 - x0);
  let hi = 1e6; S.bands.forEach((b) => { hi = Math.max(hi, b.p90); });
  drawn.forEach((t) => t.forEach((r) => { hi = Math.max(hi, r.worth); })); plan.forEach((r) => { hi = Math.max(hi, r.worth); });
  let least = hi; S.bands.forEach((b) => { least = Math.min(least, b.p10); }); drawn.forEach((t) => t.forEach((r) => { least = Math.min(least, r.worth); }));
  const floor = (v) => { const d = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1e4)))); return [5, 2, 1].map((m) => m * d).find((c) => c <= v) || d; };
  const lo = floor(least * 0.9), sc = logScale(lo, hi * 1.1, T, ph);
  const area = (a, b) => S.bands.map((r, i) => `${i ? "L" : "M"}${x(r.year).toFixed(1)},${sc.y(r[a]).toFixed(1)}`).join("") + S.bands.slice().reverse().map((r) => `L${x(r.year).toFixed(1)},${sc.y(r[b]).toFixed(1)}`).join("") + "Z";
  const line = (rows, k = "worth") => rows.map((r, i) => `${i ? "L" : "M"}${x(r.year).toFixed(1)},${sc.y(r[k]).toFixed(1)}`).join("");
  if (!Number.isFinite(UI.riskYear) || UI.riskYear < x0 || UI.riskYear > x1) UI.riskYear = Math.min(x0 + 10, x1);
  let grid = sc.ticks.map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${sc.y(v).toFixed(1)}" y2="${sc.y(v).toFixed(1)}" stroke="#2a2c31"/><text x="${L - 6}" y="${(sc.y(v) + 4).toFixed(1)}" text-anchor="end">${money(v)}</text>`).join("");
  for (let yr = x0; yr <= x1; yr++) if (yr % 5 === 0) grid += `<text x="${x(yr).toFixed(1)}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
  const kindOf = (p) => (p.solved ? (p.convergence === "unsolvable iterate" ? "edge" : "ok") : p.short ? "short" : "stuck");
  const stroke = { ok: color, edge: "#d9a13b", short: "#e5484d" };
  // Where a path that ran short ends: its last year that pays for everything.
  const endMark = (p, on) => { const t = lineOf(p), e = t[t.length - 1]; return e && !p.solved ? `<circle cx="${x(e.year).toFixed(1)}" cy="${sc.y(e.worth).toFixed(1)}" r="${on ? 5 : 3.5}" fill="#e5484d"/>` : ""; };
  // A path as a line that can be clicked: a wide, invisible line on top takes the click.
  const pathLine = (p, on) => {
    const t = lineOf(p); if (!t.length) return "";
    const k = kindOf(p), d = line(t), tip = `${p.label}${k === "short" ? ": ran short" : k === "edge" ? ": borderline" : ""}`;
    return `<g class="pl ${on ? "on" : ""}" data-act="riskPath" data-v="${p.value}"><path class="vis" d="${d}" fill="none" stroke="${on ? "#6fc2b5" : stroke[k]}" stroke-width="${on ? 2.5 : k === "ok" ? 1 : 1.5}" stroke-opacity="${on ? 1 : k === "ok" ? 0.35 : 0.85}"/>${endMark(p, on)}<path d="${d}" fill="none" stroke="transparent" stroke-width="9" pointer-events="stroke"><title>${esc(tip)}</title></path></g>`;
  };
  let marks;
  if (every) marks = S.paths.filter((p) => p !== sel).map((p) => pathLine(p, false)).join("") + (sel ? pathLine(sel, true) : "");
  else marks = (S.bands.length ? `<path d="${area("p0", "p100")}" fill="${color}" fill-opacity="0.07"/><path d="${area("p10", "p90")}" fill="${color}" fill-opacity="0.16"/><path d="${area("p25", "p75")}" fill="${color}" fill-opacity="0.32"/><path d="${line(S.bands, "p50")}" fill="none" stroke="${color}" stroke-width="2"/>` : "")
    + (sel ? pathLine(sel, true) : "");
  const fan = `<svg class="chart rchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth across ${n} paths" data-x0="${x0}" data-x1="${x1}" data-l="${L}" data-pw="${pw}" data-t="${T}" data-ph="${ph}">${grid}
    <rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent"/>
    ${marks}
    <path d="${line(plan.filter((r) => r.year >= x0 && r.year <= x1))}" fill="none" stroke="#f0efec" stroke-width="1.5" stroke-dasharray="5 4" pointer-events="none"/>
    <g id="fan-cursor" transform="translate(${x(UI.riskYear).toFixed(1)},0)" pointer-events="none"><line x1="0" x2="0" y1="${T + 14}" y2="${T + ph}" stroke="#8a8c92"/><text id="fan-cursor-year" x="0" y="${T + 10}" text-anchor="middle" style="fill:#f0efec">${UI.riskYear}</text></g></svg>`;

  // On the chart: one button that finds when the money runs out on every path that ran short.
  const todo = S.short.filter((p) => !p.runout), running = job && job.running;
  const action = running ? `<span class="rbtn">Drawing the ${job.total === 1 ? "path" : job.total + " paths"} that ran short: ${job.done} of ${job.total} done…</span>`
    : todo.length ? `<button type="button" class="rbtn" data-act="runoutAll">${todo.length} ${todo.length === 1 ? "path that ran short is" : "paths that ran short are"} not on the chart yet · Find when the money runs out · ${fmtTime(Math.ceil(todo.length / CONFIG.workers) * CONFIG.timings.runout)}</button>`
    : job && job.error ? `<span class="rbtn short small">${esc(job.error)}</span>` : "";
  const legend = `<div class="legend" style="margin-left:0">${every ? `<span><i class="ln" style="border-color:${color}"></i>A path that lasted</span>` : `<span><i class="sw" style="background:${color};opacity:.16"></i>P0–P100, every path</span><span><i class="sw" style="background:${color};opacity:.35"></i>P10–P90</span><span><i class="sw" style="background:${color};opacity:.7"></i>P25–P75</span><span><i class="ln" style="border-color:${color}"></i>Median</span>`}
    <span><i class="ln" style="border-color:#e5484d"></i>Ran short (${S.short.length})</span><span><i class="ln" style="border-color:#d9a13b"></i>Borderline (${S.borderline.length})</span><span><i class="ln dash"></i>Average markets</span>
    ${riskLife() ? `<span class="muted">With life-table lifespans paths end in different years; the band covers the paths still running</span>` : ""}</div>`;

  // The panel under the chart: same size whether or not a path is picked.
  const dots = { short: ["#e5484d", "Ran short"], edge: ["#d9a13b", "Borderline"], stuck: ["#6f7278", "Owl could not solve"] };
  // Each path's line, so hovering it in the list can draw it on the chart in either view.
  RISK_LINES = {};
  S.paths.forEach((p) => { const t = lineOf(p); if (t.length) RISK_LINES[p.value] = pathLine(p, true); });
  // Worst outcome first: ran short (earliest first), not solved, borderline, then the paths that
  // lasted from least to most savings left. A lasting path's row has the tint of the band its
  // savings left falls in, as on the chart; dots stay for ran short and borderline.
  const rank = { short: 0, stuck: 1, edge: 2, ok: 3 };
  const lastYear = (p) => (p.runout && p.runout.lastYear) || 0;
  const order = S.paths.slice().sort((a, b) => rank[kindOf(a)] - rank[kindOf(b)]
    || (kindOf(a) === "short" ? lastYear(a) - lastYear(b) : kindOf(a) === "ok" ? a.bequest - b.bequest : 0) || a.value - b.value);
  const tint = (p) => {
    const q = S.ends.length > 1 ? S.ends.indexOf(p.bequest) / (S.ends.length - 1) : 0.5;
    // The chart's band layers stack (0.07, 0.16, 0.32), so each tint is what that band looks like there.
    return q < 0.1 || q > 0.9 ? [0.07, "Savings left in the outer band (below P10 or above P90)"]
      : q < 0.25 || q > 0.75 ? [0.22, "Savings left in P10–P90"] : [0.47, "Savings left in P25–P75"];
  };
  const picker = dropdown({ attrs: 'data-act="riskPathPick"', value: sel ? String(sel.value) : "", cls: "field text", label: "Path",
    options: [{ value: "", label: "Pick a path…" }].concat(order.map((p) => {
      const k = kindOf(p), d = dots[k], t = k === "ok" && tint(p);
      return { value: String(p.value), label: p.label, dot: d && d[0], dotTitle: d && d[1], bg: t && rgba(color, t[0]), bgTitle: t && t[1] };
    })) });
  const panel = `<div class="rdetail">
      <div class="rdetail-head"><div class="dd-inline">${picker}</div><div class="rline" title="${sel ? esc(pathStatus(sel).replace(/<[^>]+>/g, "")) : ""}">${sel ? pathStatus(sel) : `<span class="muted">${every ? "Click a line on the chart, or pick a path here." : "Pick a path here, or switch to every path and click one."}</span>`}</div>
        <button type="button" data-act="riskPath" data-v="${sel ? sel.value : ""}" ${sel ? "" : "disabled"}>Clear</button></div>
      ${returnsPanel(sel, x0, x1, L, pw)}</div>`;

  return `<div class="tiles">${tiles}</div>
    <div class="chart-head"><span>Net worth, today's dollars · log scale</span>${seg([["band", "Band"], ["paths", "Every path"]], "riskView")}</div>
    <div class="fan-read" id="fan-read">${fanReadout()}</div>
    <div class="rwrap">${fan}${action}</div>${legend}
    ${panel}
    ${pathFull(sel, SLOTS[UI.riskSlot].doc)}`;
}

// ---------- editing ----------
function parse(field, raw) {
  if (field.type === "bool") return !!raw;
  if (field.type === "text" || field.type === "select") return raw;
  const clean = String(raw).replace(/[^0-9.\-]/g, "");
  if (clean === "" || isNaN(Number(clean))) return field.optional ? null : 0;
  if (field.type === "year") return Math.round(Number(clean));
  // 250k and 1.5M mean thousands and millions, not 250 and 1.5.
  const unit = field.type === "money" && /([km])\s*$/i.exec(String(raw).trim());
  return Number(clean) * (unit ? (unit[1].toLowerCase() === "k" ? 1e3 : 1e6) : 1);
}
function fieldFor(path) {
  const parts = path.split(".");
  if (CONFIG.lists[parts[0]]) return CONFIG.lists[parts[0]].fields.find((f) => f.key === parts[2]);
  for (const s of CONFIG.sections) for (const f of s.fields || []) if (f.key === parts[0]) return f;
  return null;
}
function setPath(doc, path, value) {
  const parts = path.split(".");
  if (parts.length === 1) doc[parts[0]] = value;
  else if (parts.length === 2) { doc[parts[0]] = (doc[parts[0]] || []).slice(); doc[parts[0]][+parts[1]] = value; }
  else { doc[parts[0]] = doc[parts[0]].map((it, i) => i === +parts[1] ? Object.assign({}, it, { [parts[2]]: value }) : it); }
}
function newItem(list, doc) {
  const start = doc.planStart;
  if (list === "properties") return { name: "New property", use: "other", value: 0, cost: 0, mortgage: 0, rate: 0, years: 0, sellYear: null, income: 0, growth: 0 };
  if (list === "children") return { name: "New child", born: start, collegeStart: start + 18, years: 4, cost: 0 };
  return { name: "New band", amount: 10000, from: start, to: start + 9, grows: "prices", kind: "other" };
}

      const made = (await api("POST", "/api/scenarios", { copyFrom: SLOTS[from].doc.id, name, description })).data;
      LIST = (await api("GET", "/api/scenarios")).data;
      UI.modal = null;
      await pick(into, made.id);
    } catch (err) { alert(err.message); }
    return;
  }
  if (act === "saveHouse") {
    const form = readHouseForm(), fresh = UI.modal.mode === "new", error = document.getElementById("hh-error");
    if (form.people.some((p) => !p.name || !/^(19|20)\d\d$/.test(p.born))) { error.textContent = "Give each person a name and a four-digit birth year."; return; }
    try {
      if (fresh) {
        const made = (await api("POST", "/api/households", form)).data;
        LIST = (await api("GET", "/api/scenarios")).data;
        HOUSES = (await api("GET", "/api/households")).data;
        UI.modal = null; renderModal();
        UI.editing = true; UI.open = { "Accounts": true };
        await switchHouse(made.id);
        window.scrollTo(0, 0);
        return;
      }
      HOUSE = (await api("PUT", "/api/households/" + HOUSE.id, form)).data;
      HOUSES = (await api("GET", "/api/households")).data;
    } catch (err) { error.textContent = err.message; return; }
    UI.modal = null;
    render();
    if (UI.editing) { slots().forEach((s) => { SLOTS[s].dirty = true; }); renderBar(); } else slots().forEach(solve);
  }
});
// The year marker on Risk follows the pointer, worked out from its position, without a redraw.
document.addEventListener("mousemove", (ev) => {
  const svg = ev.target.closest && ev.target.closest("#main section.risk svg[data-x0]");
  if (!svg) return;
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const at = pt.matrixTransform(svg.getScreenCTM().inverse()), d = svg.dataset;
  const x0 = +d.x0, x1 = +d.x1, L = +d.l, pw = +d.pw;
  const yr = Math.min(x1, Math.max(x0, Math.round(x0 + (at.x - L) * (x1 - x0) / pw)));
  if (yr === UI.riskYear) return;
  UI.riskYear = yr;
  const box = document.getElementById("fan-read"), cursor = document.getElementById("fan-cursor"), label = document.getElementById("fan-cursor-year");
  if (box) box.innerHTML = fanReadout();
  const fs = document.querySelector("svg.rchart"), f = fs && fs.dataset;
  if (cursor && f) cursor.setAttribute("transform", `translate(${(+f.l + (yr - +f.x0) * +f.pw / Math.max(1, +f.x1 - +f.x0)).toFixed(1)},0)`);
  if (label) label.textContent = yr;
  // The picked path's chart and card follow the same year.
  const card = document.getElementById("path-card"), pc = document.getElementById("path-cursor");
  const sel = (RISK[riskKey()] && RISK[riskKey()].result && RISK[riskKey()].result.paths || []).find((p) => p.value === UI.riskPath);
  const rows = sel ? pathRows(sel, SLOTS[UI.riskSlot].doc) : null;
  if (card) card.innerHTML = pathCard(rows);
  if (pc && rows) { const ps = pc.ownerSVGElement.dataset, a = +ps.x0, b = +ps.x1, c = Math.min(Math.max(yr, a), b); pc.setAttribute("transform", `translate(${(+ps.l + (c - a) * +ps.pw / Math.max(1, b - a)).toFixed(1)},0)`); }
});
document.addEventListener("mouseover", (ev) => {
  const col = ev.target.closest("svg.chart [data-year], .years tr[data-year]");
  if (col && !drag && +col.dataset.year !== UI.year) { UI.year = +col.dataset.year; renderTimelineOnly(); }
});

// Dragging a band's end in the spending plan changes its years.
let drag = null;
document.addEventListener("pointerdown", (ev) => {
  const h = ev.target.closest("[data-drag]");
  if (!h) return;
  const svg = document.getElementById("bands-svg");
  drag = { end: h.dataset.drag, i: +h.dataset.i, slot: svg.dataset.slot, moved: false };
  ev.preventDefault();
});
document.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const svg = document.getElementById("bands-svg"), pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const x = pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  const start = +svg.dataset.start, last = +svg.dataset.last, cw = +svg.dataset.cw, L = +svg.dataset.l;
  const band = SLOTS[drag.slot].doc.spendingBands[drag.i];
  let year = Math.round((x - L) / cw + start - (drag.end === "to" ? 1 : 0));
  year = Math.min(Math.max(year, start), last);
  year = drag.end === "from" ? Math.min(year, band.to) : Math.max(year, band.from);
  if (band[drag.end] !== year) { setPath(SLOTS[drag.slot].doc, "spendingBands." + drag.i + "." + drag.end, year); drag.moved = true; renderModal(); }
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) { render(); save(d.slot); }
});

load().catch((err) => { document.getElementById("main").innerHTML = `<div class="empty">Could not load: ${esc(err.message)}</div>`; });
</script>
