<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1012; --panel: #17181b; --aside: #1b1c20; --raise: #24262b; --button: #2e3138;
    --line: #2a2c31; --line-soft: #24262b; --dash: #3a3c42;
    --text: #f0efec; --soft: #c3c2b7; --muted: #8f8e86; --faint: #5a5c62;
    --a: #d6588f; --a-text: #f2a0c4; --b: #3987e5; --b-text: #9cc3f5; --less: #f0a27e; --ok: #7fc8a4; --dot: #e0b04a;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 'IBM Plex Sans', system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; color: var(--soft); }
  button.solid { background: var(--button); border: 0; color: var(--text); }
  button.dashed { border: 1px dashed var(--dash); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--soft); outline-offset: 1px; }
  a { color: var(--text); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .brand { display: flex; flex-direction: column; }
  .brand b { font-weight: 600; font-size: 16px; }
  nav { display: flex; gap: 4px; }
  nav button { border: 0; padding: 8px 14px; border-radius: 6px; color: var(--soft); }
  nav button.on { color: var(--text); background: var(--raise); }
  .picks { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .pick { display: flex; align-items: center; gap: 8px; color: var(--soft); }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
  /* Dropdowns: a button and a list drawn by the page, never the browser's own. */
  .dd { position: relative; display: inline-flex; min-width: 0; width: 100%; }
  .dd-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--text); text-align: left; }
  .dd-btn:hover:not(:disabled) { border-color: var(--dash); }
  .dd-btn:disabled { cursor: default; opacity: 0.55; }
  .dd-btn svg { flex: none; transition: transform 0.15s; }
  .dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-pop { position: fixed; z-index: 100; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45); max-height: 340px; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .dd-pop button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-radius: 5px; padding: 7px 10px; text-align: left; color: var(--soft); background: transparent; white-space: nowrap; }
  .dd-pop button:hover:not(:disabled), .dd-pop button:focus-visible { background: var(--button); color: var(--text); outline: none; }
  .dd-pop button:disabled { color: var(--muted); cursor: default; }
  .dd-pop button .tick { width: 12px; flex: none; }
  .dd-pop button[aria-selected="true"] { color: var(--text); }
  .dd-pop button.tinted { background: var(--bg); }
  .dd-pop button.tinted:hover:not(:disabled), .dd-pop button.tinted:focus-visible { background: var(--bg); box-shadow: inset 0 0 0 1px var(--soft); }
  .dd-sep { height: 1px; background: var(--line); margin: 4px 2px; }
  .pick .dd { width: auto; }
  .pick .dd-btn { min-width: 200px; }
  .pick.one .dd-btn { border-color: var(--dash); color: var(--text); }
  .pick.A .dd-btn { border-color: var(--a); color: var(--a-text); }
  .pick.B .dd-btn { border-color: var(--b); color: var(--b-text); }
  .pick.B.none .dd-btn { border-color: var(--line); color: var(--soft); }
  .dd.field .dd-btn { background: var(--bg); font-family: var(--mono); font-size: 13px; padding: 6px 10px; }
  .dd.field.text .dd-btn { font-family: inherit; }
  .dd.field.A .dd-btn { color: var(--a-text); }
  .dd.field.B .dd-btn { color: var(--b-text); }
  .dd.field.A.diff .dd-btn { border-color: var(--a); }
  .dd.field.B.diff .dd-btn { border-color: var(--b); }
  .dd.house { width: auto; }
  .dd.house .dd-btn { background: transparent; border: 0; padding: 2px 0; gap: 6px; color: var(--soft); font-size: 12px; }
  .dd.house .dd-btn:hover { color: var(--text); }
  .status { font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--less); }

  main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 64px; display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .timeline { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 11px; min-height: 34px; color: var(--soft); }
  .seg button.on { background: var(--button); color: var(--text); }
  .legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--soft); align-items: center; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  .charts { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chart-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .chart-head .mono { color: var(--muted); }
  svg.chart { width: 100%; height: auto; display: block; }
  svg.chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .stale { opacity: 0.45; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .years { border: 1px solid var(--line-soft); border-radius: 6px; }
  .years-head { position: sticky; top: var(--bar-h, 64px); z-index: 3; overflow: hidden; background: #1d1e22; border-radius: 6px 6px 0 0; border-bottom: 1px solid var(--line); }
  .years-body { overflow-x: auto; }
  .years table { table-layout: fixed; border-collapse: separate; border-spacing: 0; font-family: var(--mono); font-size: 12px; }
  .years th { background: #1d1e22; color: var(--soft); font-weight: 500; padding: 6px 10px; text-align: right; white-space: nowrap; }
  .years th.group { text-align: center; color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 12px; border-bottom: 1px solid var(--line-soft); }
  .years td { padding: 6px 10px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .years .stick, .years .stick2 { position: sticky; z-index: 1; background: var(--panel); }
  .years th.stick, .years th.stick2 { background: #1d1e22; vertical-align: bottom; }
  .years .stick { left: 0; }
  .years .stick2 { left: 56px; border-right: 1px solid var(--line); }
  .years tr.row.on .stick, .years tr.row.on .stick2 { background: var(--raise); }
  .years tr.row { cursor: pointer; }
  .years tr.row td { border-top: 1px solid var(--line-soft); }
  .years tr.row.on { background: var(--raise); }
  .years .l { text-align: left; }
  .years .sep { border-right: 1px solid var(--line); }

  aside { position: sticky; top: calc(var(--bar-h, 64px) + 12px); background: var(--aside); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .yearnav { display: flex; align-items: center; gap: 6px; }
  .yearnav button { width: 32px; height: 32px; padding: 0; background: var(--raise); display: inline-flex; align-items: center; justify-content: center; }
  .yearnav .big { font-size: 22px; font-weight: 600; font-family: var(--mono); min-width: 64px; text-align: center; }
  table.detail { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.detail th, table.detail td { padding: 4px; text-align: right; }
  table.detail td { font-family: var(--mono); }
  table.detail thead th { color: var(--muted); font-weight: 500; }
  table.detail tbody tr { border-top: 1px solid var(--line-soft); }
  .l { text-align: left !important; }
  .sub { padding-left: 14px !important; font-weight: 400; color: var(--soft); }
  .top { font-weight: 500; color: var(--text); }
  .events { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .events div { display: flex; gap: 6px; align-items: baseline; }
  /* The two scenarios are told apart by color only: pink on the left, blue on the right. */
  .tA { color: var(--a-text); }
  .tB { color: var(--b-text); }
  .dots { display: inline-flex; gap: 3px; flex: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; }
  .dot.A { background: var(--a); }
  .dot.B { background: var(--b); }
  .same { color: var(--faint); }


  .inputs-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .inputs-head label { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--soft); font-size: 13px; }
  /* Editing from Risk: one scenario, so one column and no comparison marks. */
  .single .grid3 { grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr); }
  .single .grid3 > :nth-child(3) { display: none; }
  .single .differs, .single .section .sum, .single .inputs-head label { display: none; }
  .single .in.A.diff, .single .dd.field.A.diff .dd-btn { border-color: var(--line); }
  .grid3 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; }
  .section { border-bottom: 1px solid var(--line-soft); }
  .clones { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
  button.clone.A { color: var(--a-text); border-color: var(--a); }
  button.clone.B { color: var(--b-text); border-color: var(--b); }
  .form.one { grid-template-columns: 1fr; }
  textarea.in { resize: vertical; font-family: inherit; }
  .section > button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 0; padding: 11px 16px; text-align: left; min-height: 44px; color: var(--text); }
  .section > button .name { font-weight: 500; }
  .kind { font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid; }
  .differs { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--dot); }
  .section > button .sum { margin-left: auto; color: var(--muted); font-size: 12px; }
  .section .body { padding: 0 16px 12px; }
  .section .grid3 { padding: 4px 0; }
  .field-label { color: var(--soft); font-size: 13px; }
  .in { background: var(--bg); border-radius: 6px; padding: 6px 10px; font-family: var(--mono); font-size: 13px; min-width: 0; width: 100%; color: var(--text); border: 1px solid var(--line); }
  .in.A { color: var(--a-text); }
  .in.B { color: var(--b-text); }
  .in.A.diff { border-color: var(--a); }
  .in.B.diff { border-color: var(--b); }
  .in.text { font-family: inherit; }
  .boolbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); }
  .boolbox input { width: 16px; height: 16px; accent-color: var(--b); }
  .boolbox.A { color: var(--a-text); }
  .boolbox.A input { accent-color: var(--a); }
  .boolbox.B { color: var(--b-text); }
  .summary { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .summary span { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .summary span.diff { font-weight: 600; }
  .summary button { flex: none; min-height: 32px; padding: 6px 12px; }
  .note { color: var(--muted); font-size: 12px; padding-top: 4px; }
  .tip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; margin-left: 6px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); font-size: 10px; font-weight: 600; cursor: help; vertical-align: 1px; }
  .tip:hover, .tip:focus { color: var(--text); border-color: var(--soft); outline: none; }
  .tip:hover::after, .tip:focus::after { content: attr(data-help); position: absolute; left: 0; top: 20px; z-index: 30; width: 300px; padding: 8px 10px; background: #1f2126; border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: 400 12px/1.45 'IBM Plex Sans', system-ui, sans-serif; white-space: normal; text-align: left; }

  .outcome { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .outcome table { width: 100%; max-width: 980px; border-collapse: collapse; font-size: 13px; }
  .outcome th, .outcome td { padding: 6px 8px; text-align: right; }
  .outcome td { font-family: var(--mono); }
  .outcome thead th { color: var(--muted); font-size: 12px; font-weight: 500; }
  .outcome tbody tr { border-top: 1px solid var(--line-soft); }
  .outcome tbody tr.head { border-top-color: var(--dash); }
  .outcome tr.head th, .outcome tr.head td { font-weight: 600; }
  .outcome th.sub { padding-left: 24px !important; }

  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(5, 6, 8, 0.72); display: flex; align-items: flex-start; justify-content: center; padding: 48px 24px; overflow: auto; }
  .dialog { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; }
  .dialog-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dialog-head .title { font-weight: 600; font-size: 16px; }
  .dialog-head .close { margin-left: auto; width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .dialog .pad { padding: 14px 18px; }
  .dialog.solving { align-items: center; text-align: center; gap: 8px; padding: 28px 24px; }
  .dialog.solving .title { font-weight: 600; font-size: 16px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--text); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  button.primary { background: var(--text); color: var(--bg); font-weight: 500; }
  .dialog .foot { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line-soft); }
  .todo-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; }
  .todo-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .todo-cols.one { grid-template-columns: minmax(0, 1fr); }
  .todo { border-top: 3px solid var(--line); padding-top: 10px; }
  .todo-head { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .todo-who { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--soft); margin: 12px 0 4px; }
  .todo ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.4; }
  .todo-open { width: 100%; margin: 4px 0 8px; }
  .dialog .foot button:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 760px) { .todo-cols { grid-template-columns: 1fr; } }
  .form .person { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px 18px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .form .fixed { padding: 7px 0; color: var(--text); }
  @media (max-width: 640px) { .form .person { grid-template-columns: 1fr; } }
  .risk { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .dd-inline { width: 220px; }
  .dd-inline.wide { width: 300px; }
  .how { border: 1px solid var(--line); border-radius: 8px; background: var(--aside); padding: 4px 14px 10px; font-size: 13px; color: var(--soft); line-height: 1.55; }
  .how summary { cursor: pointer; padding: 8px 0; color: var(--text); font-weight: 500; }
  .how dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; margin: 4px 0 0; }
  .how dt { color: var(--muted); }
  .how dd { margin: 0; }
  .how ol { margin: 0; padding-left: 18px; }
  table.regret { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.regret th { text-align: left; color: var(--muted); font-weight: 400; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.regret td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); }
  table.regret tr.on td { background: var(--raise); }
  table.regret .short { color: #e5484d; font-weight: 600; }
  .rwrap { position: relative; }
  .linkish { border: 0; padding: 0; background: none; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .linkish.muted { color: var(--muted); }
  .dd-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
  .stage { margin-top: 12px; }
  .stage-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 0 80px; }
  .stage-center .bar-track { width: min(520px, 80%); }
  .big-run { font-size: 17px; padding: 14px 28px; border-radius: 10px; }
  /* At the bottom of the chart, where the paths that ran short are drawn once found. */
  .rwrap .rbtn { position: absolute; bottom: 44px; left: calc(64 / 1200 * 100% + (100% - 76 / 1200 * 100%) / 2); transform: translateX(-50%);
    white-space: nowrap; padding: 10px 18px; border-radius: 8px; border: 1px solid #e5484d; background: #2a1517; color: #ffb4b6; font-weight: 600; }
  .rwrap button.rbtn:hover { background: #3a1a1d; }
  .rchart .pl { cursor: pointer; }
  .rchart .pl:hover .vis { stroke-opacity: 1; stroke-width: 2.5; }
  .pfull { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .pfull-body { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
  .pfull .pc-year { margin-bottom: 6px; }
  @media (max-width: 900px) { .pfull-body { grid-template-columns: 1fr; } }
  .rdetail { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  .rdetail-head { display: flex; align-items: center; gap: 12px; height: 38px; }
  .rdetail-head .dd-inline { flex: 0 0 240px; }
  .rline { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .rline .short { color: #e5484d; font-weight: 600; } .rline .edge { color: #d9a13b; font-weight: 600; }
  .fan-read.rline { display: flex; flex-wrap: nowrap; }
  .failing { margin-top: 12px; display: grid; gap: 8px; font-size: 13px; }
  .failing > div { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .failing .short { color: #e5484d; font-weight: 600; margin-right: 6px; }
  .failing .edge { color: #d9a13b; font-weight: 600; margin-right: 6px; }
  .failing .pathpick { margin: 2px 4px 2px 0; padding: 2px 8px; font-size: 12px; border-radius: 10px; background: transparent; border: 1px solid #3a3c42; color: #f0efec; cursor: pointer; }
  .failing .pathpick.red { border-color: #e5484d; } .failing .pathpick.amber { border-color: #d9a13b; } .failing .pathpick.grey { border-color: #6f7278; }
  .failing .pathpick.on { background: #6fc2b5; border-color: #6fc2b5; color: #111; }
  .risk-lead { margin: 2px 0 4px; color: var(--soft); font-size: 13px; max-width: 980px; line-height: 1.5; }
  .risk-run { padding: 40px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .bar-track { width: min(420px, 90%); height: 8px; background: var(--raise); border-radius: 4px; overflow: hidden; }
  .bar-track div { height: 100%; transition: width 0.4s; }
  .risk-stale { padding: 8px 12px; border: 1px solid var(--dash); border-radius: 6px; color: var(--soft); display: flex; align-items: center; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--aside); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
  .tile .big { font-size: 22px; color: var(--text); }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .fan-read { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--soft); min-height: 18px; }
  .fan-read b { color: var(--text); font-weight: 500; }

// A scenario's name in its color: pink for the left slot, blue for the right.

// ---------- server ----------
async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok && res.status !== 409) throw new Error(data.error || res.statusText);
  return { status: res.status, data };
}

async function load() {
  CONFIG = (await api("GET", "/api/config")).data;

  await pick("A", first.id, true);
  render();
}

function openHouse(mode) {
  UI.modal = mode === "new"
    ? { kind: "house", mode, state: HOUSE.state || "", people: [{ name: "", born: "", sex: "F" }, { name: "", born: "", sex: "M" }] }
    : { kind: "house", mode, state: HOUSE.state || "", people: people().map((p) => ({ name: p.name, born: String(p.born), sex: p.sex || "F" })) };

function readHouseForm() {

// Scenarios compare only within one household, so switching household shows its first scenario alone.
async function switchHouse(id) {
  const mine = LIST.filter((s) => s.household === id);
  if (!mine.length) return;
  HOUSE = (await api("GET", "/api/households/" + id)).data;
  UI.year = null;
  SLOTS.B.doc = null;
  await pick("A", mine[0].id, true);

}

// Deletes what Owl worked out for this household (its plans and Risk runs); the inputs stay, and
// the plans on screen are solved again.
async function clearCache() {
  if (!confirm(`Clear every saved result for ${HOUSE.name}? This deletes the solved plans and all Risk Analysis runs. Your inputs stay, and the plans on screen are solved again.`)) return;
  try { await api("POST", `/api/households/${HOUSE.id}/clear-cache`); } catch (err) { alert(err.message); return; }
  for (const k in RISK) if (k.startsWith(HOUSE.id + "/")) { clearTimeout(POLL[k]); delete POLL[k]; delete RISK[k]; }
  for (const k in SUMMARY) if (k.startsWith(HOUSE.id + "/")) delete SUMMARY[k];
  LIST = (await api("GET", "/api/scenarios")).data;
  UI.riskPath = null;
  // Load the plans on screen again; with no saved result, each is solved.
  const ids = slots().map((s) => [s, SLOTS[s].doc.id]);
  for (const [s] of ids) SLOTS[s].doc = null;
  for (const [s, id] of ids) await pick(s, id, true);
  render();
}

async function pick(slot, id, quiet) {
  if (!id) {
    Object.assign(SLOTS[slot], { doc: null, error: "", busy: "", seconds: null, dirty: false });
    if (UI.mode === "diff") UI.mode = "side";
    if (!quiet) render();
    return;
  }
  const other = SLOTS[slot === "A" ? "B" : "A"];
  SLOTS[slot].doc = other.doc && other.doc.id === id ? other.doc : (await api("GET", "/api/scenarios/" + id)).data;
  SLOTS[slot].error = ""; SLOTS[slot].seconds = null; SLOTS[slot].dirty = false;

  // While editing, an unsolved scenario waits for Done.
  if (!SLOTS[slot].doc.result && !UI.editing) solve(slot);

}

// Every change saves, then Owl solves again. A change made while Owl is solving waits for it.
// When both columns show the same scenario, they share one copy, so an edit in either is the edit.
function mirror(slot) {
  const other = slot === "A" ? "B" : "A", S = SLOTS[slot], O = SLOTS[other];
  if (O.doc && S.doc && O.doc.id === S.doc.id) Object.assign(O, { doc: S.doc, dirty: S.dirty, seconds: S.seconds, error: S.error });

async function save(slot) {
  const S = SLOTS[slot], doc = S.doc;

    const saved = (await api("PUT", "/api/scenarios/" + doc.id, body)).data;
    LIST = (await api("GET", "/api/scenarios")).data;

// ---------- the plan, year by year ----------
function rowsOf(doc) {
  const t = doc && doc.result && doc.result.timeline;

      insurance: r.insurance || 0, medicare: r.medicare || 0, worth: r.taxable + r.pretax + r.roth + r.realEstate - r.debt };

    let medical = 0;

      if (x.kind === "health") medical += x.amount;

  (doc.children || []).forEach((c) => { if (year >= c.collegeStart && year < c.collegeStart + c.years) out.push({ what: "College", kind: "college", amount: c.cost * Math.pow(1 + (doc.collegeAbove || 0) / 100, year - start) }); });
  (doc.spendingBands || []).forEach((b, i) => { if (year >= b.from && year <= b.to) out.push({ what: b.name, kind: b.kind, band: i, amount: b.amount * (b.grows === "health" ? Math.pow(1 + (doc.healthAbove || 0) / 100, year - start) : 1) }); });

  const out = [], end = rows[rows.length - 1].year, start = doc.planStart, ages = claimAges(doc);
  out.push({ year: start, label: "Plan starts" });
  if (doc.taxCutsEnd) out.push({ year: doc.taxCutsEnd, label: "Lower tax rates assumed to end" });
  (doc.children || []).forEach((c) => { if (c.years > 0) out.push({ year: c.collegeStart, label: c.name + " starts college" }); });
  (doc.properties || []).forEach((p) => {
    if (p.mortgage && p.years && (!p.sellYear || p.sellYear > start + p.years - 1)) out.push({ year: start + p.years - 1, label: "Mortgage on " + p.name + " paid off" });
    if (p.sellYear) out.push({ year: p.sellYear, label: p.name + " sold" });
  });
  people().forEach((p, i) => {
    if ((doc.workUntil || [])[i]) out.push({ year: doc.workUntil[i], label: p.name + "'s last year of work" });
    out.push({ year: p.born + CONFIG.rules.medicareAge, label: p.name + " on Medicare" });
    out.push({ year: p.born + Math.floor(ages[i]), label: p.name + " claims Social Security at " + ageText(ages[i]) });
    out.push({ year: p.born + rmdAge(p.born), label: p.name + " reaches required-withdrawal age" });
    if (p.born + doc.planTo[i] < end) out.push({ year: p.born + doc.planTo[i], label: "Plan assumes " + p.name + " lives to " + doc.planTo[i] });

// ---------- header ----------
// One menu for households: switch, edit this one, or start a new one.
function houseMenu() {

  return dropdown({ attrs: 'data-act="house"', value: HOUSE.id, cls: "house", label: "Household",
    options: homes.map((h) => ({ value: h.id, label: h.name }))

}

  const busy = slots().filter((s) => SLOTS[s].busy), bad = slots().filter((s) => SLOTS[s].error);
  let status;
  if (bad.length) status = `<span class="status bad" title="${esc(SLOTS[bad[0]].error)}">Owl could not solve ${bad.map(nameOf).join(" and ")}. Hover for the reason.</span>`;
  else if (UI.editing && slots().some((s) => SLOTS[s].dirty)) status = `<span class="status">Saved · solves when you press Done</span>`;
  else if (busy.length) status = `<span class="status">${busy.map((s) => SLOTS[s].busy + " " + nameOf(s)).join(" · ")}…</span>`;
  else {
    const secs = slots().map((s) => SLOTS[s].seconds).filter((v) => v != null);
    status = `<span class="status ok"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="#7fc8a4" stroke-width="1.6"/></svg>Saved and solved${secs.length ? " · " + Math.max(...secs) + " s" : ""}</span>`;
  }
  document.getElementById("bar").innerHTML = `
    <div class="brand"><b>Perch</b>${houseMenu()}</div>
    <nav aria-label="Views">${[["compare", "View"], ["risk", "Risk Analysis"]].map(([v, label]) => `<button type="button" class="${UI.page === v && !UI.editing ? "on" : ""}" data-act="page" data-v="${v}" ${UI.page === v && !UI.editing ? 'aria-current="page"' : ""}>${label}</button>`).join("")}</nav>
    <div class="picks">
      ${UI.page === "risk"
        ? `<div class="pick one">${dropdown({ attrs: 'data-risk-pick="1"', value: A.id, options: mine.map((s) => ({ value: s.id, label: s.name })), label: "Scenario" })}</div>`
        : `<div class="pick A">${dropdown({ attrs: 'data-pick="A"', value: A.id, options: options("A"), label: B ? "Pink scenario" : "Scenario" })}</div>
      ${B ? '<span class="muted">vs</span>' : ""}
      <div class="pick B ${B ? "" : "none"}">${dropdown({ attrs: 'data-pick="B"', value: B ? B.id : "", options: options("B"), label: "Compare with" })}</div>`}
      ${UI.editing ? `<button type="button" class="solid primary" data-act="done">Done · solve</button>` : `<button type="button" class="solid" data-act="edit">Edit inputs</button>`}
      ${status}
    </div>`;
}

// ---------- timeline ----------
function seg(list, key) {
  return `<div class="seg" role="group">${list.map(([v, label]) => `<button type="button" class="${UI[key] === v ? "on" : ""}" data-act="ui" data-k="${key}" data-v="${v}">${label}</button>`).join("")}</div>`;
}

function renderTimeline() {
  const A = rowsOf(SLOTS.A.doc), B = rowsOf(SLOTS.B.doc);
  if (!A.length && !B.length) return `<section class="panel timeline" aria-label="Timeline"><div class="empty">Owl is solving…</div></section>`;
  // Difference needs two plans.
  if (!two() && UI.mode === "diff") UI.mode = "side";
  const years = [...new Set(A.concat(B).map((r) => r.year))].sort((x, y) => x - y);
  const first = years[0], last = years[years.length - 1];
  if (UI.year == null || UI.year < first || UI.year > last) UI.year = Math.min(first + 4, last);
  const R = [first, last], span = Math.max(1, R[1] - R[0]);
  const inR = (r) => r.year >= R[0] && r.year <= R[1];
  const a = A.filter(inR), b = B.filter(inR), year = Math.min(Math.max(UI.year, R[0]), R[1]);
  UI.year = year;

  const all = [];
  milestones(SLOTS.A.doc).forEach((m) => all.push({ year: m.year, label: m.label, who: "A" }));
  milestones(SLOTS.B.doc).forEach((m) => { const hit = all.find((o) => o.year === m.year && o.label === m.label); if (hit) hit.who = "both"; else all.push({ year: m.year, label: m.label, who: "B" }); });
  all.sort((x, y) => x.year - y.year);
  const markFill = { A: COLOR.A, B: COLOR.B, both: "#c3c2b7" };

  function frame(W, H, ymin, ymax) {
    const L = 58, Rp = 10, T = 8, Bp = 34, pw = W - L - Rp, ph = H - T - Bp;
    const x = (yr) => L + (yr - R[0]) * pw / span, y = (v) => T + ph * (ymax - v) / (ymax - ymin || 1);
    const step = niceStep(ymax - ymin); let grid = "";
    for (let v = Math.ceil(ymin / step) * step; v <= ymax + 1e-6; v += step) {
      grid += `<line x1="${L}" x2="${W - Rp}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${Math.abs(v) < 1e-6 ? "#5a5c62" : "#2a2c31"}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${Math.abs(v) < 1e-6 ? "$0" : money(v)}</text>`;
    }
    const every = span > 30 ? 5 : span > 16 ? 2 : 1; let xt = "";
    for (let yr = R[0]; yr <= R[1]; yr++) if (yr % every === 0) xt += `<text x="${x(yr).toFixed(1)}" y="${H - 4}" text-anchor="middle">${yr}</text>`;
    const cw = pw / span; let cols = "";
    for (let yr = R[0]; yr <= R[1]; yr++) cols += `<rect x="${(x(yr) - cw / 2).toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${ph + 20}" fill="transparent" data-year="${yr}"/>`;
    const cross = `<line x1="${x(year).toFixed(1)}" x2="${x(year).toFixed(1)}" y1="${T}" y2="${T + ph + 16}" stroke="#f0efec"/>`;
    return { W, H, T, ph, pw, x, y, grid, xt, cols, cross };
  }
  function marks(f, who) {
    const byYear = {};
    all.filter((m) => m.year >= R[0] && m.year <= R[1] && (who === "all" || m.who === "both" || m.who === who)).forEach((m) => { (byYear[m.year] = byYear[m.year] || []).push(m); });
    return Object.keys(byYear).map((yk) => {
      const ms = byYear[yk], x = f.x(+yk), y0 = f.T + f.ph + 4, w = ms.length > 1 || ms[0].who === "both" ? "both" : ms[0].who;
      return `<path d="M${x.toFixed(1)},${y0}l5,9h-10z" fill="${markFill[w]}"><title>${esc(yk + ": " + ms.map((m) => m.label).join("; "))}</title></path>`;
    }).join("");
  }
  const svg = (f, inner, label) => `<svg class="chart" viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="${esc(label)}">${f.grid}${inner}${f.xt}${f.cross}${f.cols}</svg>`;

  let charts = "";
  const LAYERS = UI.stack === "spend" ? SPEND : STACK;
  if (UI.view === "chart" && UI.mode === "side") {
    let ymax = 1; a.concat(b).forEach((r) => { ymax = Math.max(ymax, LAYERS.reduce((t, [k]) => t + r[k], 0)); });
    ymax = Math.ceil(ymax / niceStep(ymax)) * niceStep(ymax);
    const stack = (rows, slot) => {
      const doc = SLOTS[slot].doc, f = frame(980, two() ? 214 : 440, 0, ymax);
      if (!rows.length) return `<div class="empty">Solving ${slot}…</div>`;
      let base = rows.map(() => 0), areas = "";
      LAYERS.forEach(([key, , fill]) => {
        const topv = rows.map((r, i) => base[i] + r[key]);
        let d = "M" + rows.map((r, i) => f.x(r.year).toFixed(1) + "," + f.y(topv[i]).toFixed(1)).join("L");
        d += "L" + rows.map((r, i) => f.x(r.year).toFixed(1) + "," + f.y(base[i]).toFixed(1)).reverse().join("L") + "Z";
        areas += `<path d="${d}" fill="${fill}" stroke="#17181b" stroke-width="1.5"/>`;
        base = topv;
      });
      const sel = rows.find((r) => r.year === year) || rows[0];
      return `<div class="${doc.stale ? "stale" : ""}"><div class="chart-head"><span>${nameOf(slot)}</span><span class="mono">${sel.year} · ${UI.stack === "spend" ? money(sel.outflow) + " spent" : money(sel.worth) + " net worth"}</span></div>${svg(f, areas + marks(f, slot), slot + " · " + doc.name)}</div>`;
    };
    charts = stack(a, "A") + (two() ? stack(b, "B") : "");
  } else if (UI.view === "chart") {
    const M = [METRICS[UI.metric][1], UI.metric];
    if (UI.mode === "overlay") {
      let mx = 1; a.concat(b).forEach((r) => { mx = Math.max(mx, r[M[1]]); }); mx = Math.ceil(mx / niceStep(mx)) * niceStep(mx);
      const f = frame(980, 440, 0, mx);
      const line = (rows, color) => rows.length ? `<path d="M${rows.map((r) => f.x(r.year).toFixed(1) + "," + f.y(r[M[1]]).toFixed(1)).join("L")}" fill="none" stroke="${color}" stroke-width="2"/>` : "";
      const ra = a.find((r) => r.year === year), rb = b.find((r) => r.year === year);
      charts = `<div class="chart-head"><span>${M[0]} · ${nameOf("A")}${two() ? " vs " + nameOf("B") : ""}</span><span class="mono">${year} · <span class="tA">${money(ra && ra[M[1]])}</span>${two() ? ` · <span class="tB">${money(rb && rb[M[1]])}</span>` : ""}</span></div>${svg(f, line(a, COLOR.A) + line(b, COLOR.B) + marks(f, "all"), M[0])}`;
    } else {
      const bm = {}; b.forEach((r) => { bm[r.year] = r; });
      // Owl's answers wobble by a few dollars; differences under $500 count as none.
      const ds = a.filter((r) => bm[r.year]).map((r) => { const v = bm[r.year][M[1]] - r[M[1]]; return { year: r.year, v: Math.abs(v) < 500 ? 0 : v }; });
      let lo = 0, hi = 0; ds.forEach((d) => { lo = Math.min(lo, d.v); hi = Math.max(hi, d.v); });
      const st = niceStep(Math.max(hi - lo, 10000)); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st; if (hi === lo) hi = lo + st;
      const g = frame(980, 440, lo, hi), bw = Math.max(2, g.pw / span - 3);
      const bars = ds.filter((d) => d.v).map((d) => { const y0 = g.y(0), y1 = g.y(d.v); return `<rect x="${(g.x(d.year) - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" rx="2" fill="${d.v >= 0 ? COLOR.B : COLOR.A}"/>`; }).join("");
      const sel = ds.find((d) => d.year === year);
      charts = `<div class="chart-head"><span>Difference in ${M[0].toLowerCase()} · the bar's color shows which is higher: ${nameOf("B")} up, ${nameOf("A")} down</span><span class="mono">${year} · ${sel && Math.abs(sel.v) >= 500 ? `<span class="t${sel.v > 0 ? "B" : "A"}">${money(Math.abs(sel.v))} higher</span>` : "same"}</span></div>${ds.some((d) => d.v) ? "" : `<div class="muted small">No difference in any year.</div>`}${svg(g, bars + marks(g, "all"), "Difference in " + M[0])}`;
    }
  } else {
    const bm = {}; B.forEach((r) => { bm[r.year] = r; });
    const am = {}; A.forEach((r) => { am[r.year] = r; });
    // Two tables share one set of column widths: the header sticks to the top of the page and
    // follows the body's sideways scroll, so the page itself is the only vertical scroll.
    const cols = [56, 92]; TABLE_GROUPS.forEach(() => cols.push(...(two() ? [88, 88] : [96])));
    const width = cols.reduce((t, w) => t + w, 0);
    const colgroup = `<colgroup>${cols.map((w) => `<col style="width:${w}px">`).join("")}</colgroup>`;
    const head = `<tr><th class="l stick">Year</th><th class="l stick2">Ages</th>${TABLE_GROUPS.map(([label]) => `<th class="group sep" colspan="${two() ? 2 : 1}">${label}</th>`).join("")}</tr>`;
    const body = years.map((y) => {
      const r = am[y] || {}, q = bm[y] || {};
      const cells = TABLE_GROUPS.map(([, key]) => two() ? `<td class="tA">${money(r[key])}</td><td class="tB sep">${money(q[key])}</td>` : `<td class="tA sep">${money(r[key])}</td>`).join("");
      return `<tr class="row ${y === year ? "on" : ""}" data-year="${y}"><td class="l stick">${y}</td><td class="l stick2 muted">${people().map((p) => y - p.born).join(" / ")}</td>${cells}</tr>`;
    }).join("");
    charts = `<div class="years"><div class="years-head"><table style="width:${width}px">${colgroup}<thead>${head}</thead></table></div>
      <div class="years-body" data-sync="years"><table style="width:${width}px">${colgroup}<tbody>${body}</tbody></table></div></div>`;
  }

  const legend = (UI.view === "chart" && UI.mode === "side" ? LAYERS.map(([, label, fill]) => `<span><span class="chip" style="background:${fill}"></span>${label}</span>`).join("") : "")
    + (UI.view === "chart" ? `<span><svg width="10" height="8" viewBox="0 0 10 8" aria-hidden="true"><path d="M5 0L10 8H0Z" fill="#c3c2b7"/></svg>Milestone</span>` : "")
    + `<span class="muted">Today's dollars</span>`;

  return `<section class="panel timeline" aria-label="Timeline">
    <div class="tools">
      ${seg([["chart", "Chart"], ["table", "Table"]], "view")}
      ${UI.view === "chart" ? seg(two() ? [["side", "Side by side"], ["overlay", "Overlay"], ["diff", "Difference"]] : [["side", "Stacked"], ["overlay", "One measure"]], "mode") : ""}
      ${UI.view === "chart" && UI.mode === "side" ? seg([["worth", "Savings"], ["spend", "Spending"]], "stack") : ""}
      ${UI.view === "chart" && UI.mode !== "side" ? seg(Object.keys(METRICS).map((k) => [k, METRICS[k][0]]), "metric") : ""}
      <div class="legend">${legend}</div>
    </div>
    <div class="split"><div class="charts">${charts}</div>${renderAside(A, B, all, first, last)}</div>
  </section>`;
}

function renderAside(A, B, all, first, last) {
  const year = UI.year, ra = A.find((r) => r.year === year), rb = B.find((r) => r.year === year);
  const get = (r, k) => !r ? null : r[k];
  // Spending by category, without the mortgage payment. A category shows in every year once
  // either plan has it in any year, so the card keeps its height from year to year.
  const used = (k) => A.concat(B).some((r) => Math.abs(r[k]) >= 1);
  const spend = [["Base", "base"], ["Health insurance", "insurance"], ["Medicare", "medicare"], ["Health costs", "medical"], ["College", "college"], ["Gifts", "gifts"], ["Other bands", "other"]]
    .filter(([, k]) => k === "base" || used(k)).map(([label, k]) => [label, k, 1]);
  const defs = [["Net worth", "worth", 0], ["Taxable", "taxable", 1], ["Pre-tax", "pretax", 1], ["Roth", "roth", 1], ["Real estate", "re", 1], ["Mortgages", "debt", 1],
    ["Spending, before mortgage", "living", 0], ...spend, ["Tax paid", "tax", 0], ["Top bracket", "bracket", 1], ["Roth conversion", "conv", 0], ["Social Security", "ss", 0]];
  const rows = defs.map(([label, key, sub]) => {
    const va = get(ra, key), vb = get(rb, key);
    const pct = (v) => (v == null ? "—" : v + "%"), show = key === "bracket" ? pct : money;
    return `<tr><th class="l ${sub ? "sub" : key === "bracket" ? "sub" : "top"}">${label}</th><td class="tA">${show(va)}</td>${two() ? `<td class="tB">${show(vb)}</td>` : ""}</tr>`;
  }).join("");
  const events = all.filter((m) => m.year === year);
  // Room for the busiest year's milestones, so stepping through years doesn't move the page.
  const room = Math.max(1, ...Object.values(all.reduce((c, m) => (c[m.year] = (c[m.year] || 0) + 1, c), {})));
  const pad = '<div aria-hidden="true">&nbsp;</div>'.repeat(room - Math.max(1, events.length));
  return `<aside aria-label="Year detail">
    <div class="yearnav">
      <button type="button" aria-label="Previous year" data-act="year" data-v="${Math.max(first, year - 1)}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5" fill="none" stroke="#f0efec" stroke-width="1.6"/></svg></button>
      <div class="big">${year}</div>
      <button type="button" aria-label="Next year" data-act="year" data-v="${Math.min(last, year + 1)}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" fill="none" stroke="#f0efec" stroke-width="1.6"/></svg></button>
      <span class="small" style="color:var(--soft);margin-left:6px">${people().map((p) => esc(p.name) + " " + (year - p.born)).join(" · ")}</span>
    </div>
    <button type="button" class="todo-open" data-act="yearModal" data-v="${year}">What to do in ${year}</button>
    <table class="detail"><tbody>${rows}</tbody></table>
    <div class="events">${events.length ? events.map((m) => `<div><span class="dots" title="${m.who === "both" ? "Both" : esc(SLOTS[m.who].doc.name)}">${(m.who === "both" ? ["A", "B"] : [m.who]).map((w) => `<i class="dot ${w}"></i>`).join("")}</span><span>${esc(m.label)}</span></div>`).join("") : '<div class="muted">No milestones this year.</div>'}${pad}</div>
  </aside>`;
}

// ---------- inputs ----------
function shown(field, v) {
  if (v == null) return "";
  if (field.type === "money") return dollars(v);
  return String(v);
}
function inputHtml(slot, field, v, diff, path) {
  const id = `in-${slot}-${path}`, label = esc(field.label + ", " + SLOTS[slot].doc.name);
  if (field.type === "bool") return `<label class="boolbox ${slot} ${diff ? "diff" : ""}"><input type="checkbox" id="${id}" data-slot="${slot}" data-path="${path}" ${v ? "checked" : ""} aria-label="${label}">${v ? "Yes" : "No"}</label>`;
  if (field.type === "select") return dropdown({ attrs: `id="${id}" data-slot="${slot}" data-path="${path}"`, value: v, cls: `field text ${slot} ${diff ? "diff" : ""}`, label: field.label + ", " + SLOTS[slot].doc.name,
    options: field.options.map(([val, text]) => ({ value: val, label: text })) });
  return `<input class="in ${slot} ${field.type === "text" ? "text" : ""} ${diff ? "diff" : ""}" id="${id}" data-slot="${slot}" data-path="${path}" value="${esc(shown(field, v))}" aria-label="${label}" ${field.type === "text" ? "" : 'inputmode="decimal"'}>`;
}
function listSummary(name, item) {
  if (name === "properties") return [item.name, money(item.value), item.mortgage ? "mortgage " + money(item.mortgage) : "", item.sellYear ? "sold " + item.sellYear : "Keep"].filter(Boolean).join(" · ");
  if (name === "children") return item.years > 0 ? `College ${item.collegeStart}–${item.collegeStart + item.years - 1} · ${dollars(item.cost)}/yr` : "No college";
  return "";
}
function bandsSummary(doc) {
  const bands = doc.spendingBands || [], total = bands.reduce((t, b) => t + b.amount * (b.to - b.from + 1), 0);
  return `${bands.length} band${bands.length === 1 ? "" : "s"} · ${money(total)} over the plan`;
}

// A field with showIf only matters when the fields it names hold those values.
// The estate-tax exemption: one per person, a couple's combined at the second death.
function exemption() { return CONFIG.rules.estateExemptionPerPerson * Math.max(1, people().length); }
// A section's note, with the part that only applies to a couple.
function noteOf(sec) { return [sec.note, people().length > 1 ? sec.coupleNote : ""].filter(Boolean).join(" "); }
// A field marked couple only matters when the household has two people.
function applies(doc, field) { if (field.couple && people().length < 2) return false; return !field.showIf || Object.entries(field.showIf).every(([k, v]) => (doc[k] ?? false) === v); }

function renderInputs() {
  // With one plan, the second column is the same plan, hidden; nothing differs.
  const single = UI.page === "risk" || !two();
  const A = SLOTS.A.doc, B = SLOTS.B.doc || A, P = people();
  const sections = CONFIG.sections.map((sec) => {
    const rows = []; let count = 0;
    const push = (row, diff) => { if (diff) count++; rows.push(row); };
    if (sec.list) {
      const spec = CONFIG.lists[sec.list], la = A[sec.list] || [], lb = B[sec.list] || [], n = Math.max(la.length, lb.length);
      for (let i = 0; i < n; i++) {
        const diff = JSON.stringify(la[i]) !== JSON.stringify(lb[i]), any = la[i] || lb[i];
        const label = sec.list === "children" ? any.name + " (born " + any.born + ")" : spec.title + " " + (i + 1);
        const cell = (slot, item) => ({ sum: item ? listSummary(sec.list, item) : "—", diff, slot, act: item ? `data-act="item" data-slot="${slot}" data-list="${sec.list}" data-i="${i}"` : "" });
        push({ kind: "sum", label, a: cell("A", la[i]), b: cell("B", lb[i]) }, diff);
      }
      rows.push({ kind: "add", list: sec.list, label: spec.add });
    }
    {
      (sec.fields || []).forEach((f) => {
        if (f.list) {
          const diff = JSON.stringify(A[f.list]) !== JSON.stringify(B[f.list]);
          push({ kind: "sum", label: f.label, a: { sum: bandsSummary(A), diff, slot: "A", act: `data-act="bands" data-slot="A"`, verb: "Edit plan" }, b: { sum: bandsSummary(B), diff, slot: "B", act: `data-act="bands" data-slot="B"`, verb: "Edit plan" } }, diff);
          return;
        }
        const useA = applies(A, f), useB = applies(B, f);
        if (!useA && !useB) return;
        const unused = '<span class="muted small">Not used</span>';
        const each = f.perPerson ? P.map((p, i) => [f.label.replace("{name}", p.name), f.key + "." + i, (A[f.key] || [])[i], (B[f.key] || [])[i]]) : [[f.label, f.key, A[f.key], B[f.key]]];
        each.forEach(([label, path, va, vb]) => { const diff = useA && useB && JSON.stringify(va) !== JSON.stringify(vb); push({ kind: "input", label, help: f.help, a: useA ? inputHtml("A", f, va, diff, path) : unused, b: !two() ? "<span></span>" : useB ? inputHtml("B", f, vb, diff, path) : unused }, diff); });
      });
    }
    return { sec, rows, count };
  }).filter((x) => !UI.diffOnly || x.count);

  return `<section class="panel ${single ? "single" : ""}" aria-label="Inputs">
    <div class="inputs-head"><b>Inputs</b><span class="muted small">Facts are what is true today. Choices are yours to make. Changes save as you go; press Done to solve.</span>
      <label><input type="checkbox" data-act="diffOnly" ${UI.diffOnly ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--soft)">Only sections that differ</label></div>
    <div class="grid3 clones"><span></span>${slots().map((s) => `<div class="clone-row"><button type="button" class="clone ${s}" data-act="cloneAsk" data-slot="${s}">Clone ${esc(SLOTS[s].doc.name)}…</button><a class="export" href="/api/scenarios/${esc(SLOTS[s].doc.id)}/export" download title="A zip with the case and workbook Owl's own app opens">Export to Owl</a></div>`).join("")}</div>
    ${sections.map(({ sec, rows, count }) => {
      const open = !!UI.open[sec.name], color = KIND_COLOR[sec.kind] || "#c3c2b7";
      return `<div class="section">

          <span class="name">${esc(sec.name)}</span><span class="kind" style="color:${color};border-color:${color}">${esc(sec.kind)}</span>
          ${count ? '<span class="differs" aria-label="Differs between the two scenarios"></span>' : ""}
          <span class="sum">${count ? count + " differ" : "Same in both"}</span>
        </button>
        ${open ? `<div class="body">${rows.map((r) => {
          if (r.kind === "add") return `<div class="grid3"><span></span>${slots().map((s) => `<button type="button" class="dashed" style="justify-self:start" data-act="add" data-slot="${s}" data-list="${r.list}">${esc(r.label)}</button>`).join("")}</div>`;
          if (r.kind === "sum") return `<div class="grid3"><span class="field-label">${esc(r.label)}</span>${[r.a, two() ? r.b : null].map((c) => !c ? "<span></span>" : `<div class="summary"><span class="t${c.slot} ${c.diff ? "diff" : ""}">${esc(c.sum)}</span>${c.act ? `<button type="button" class="solid" ${c.act}>${c.verb || "Edit"}</button>` : ""}</div>`).join("")}</div>`;
          return `<div class="grid3"><span class="field-label">${esc(r.label)}${tip(r.help)}</span>${r.a}${r.b}</div>`;
        }).join("")}${noteOf(sec) ? `<div class="note">${esc(noteOf(sec))}</div>` : ""}</div>` : ""}
      </div>`;
    }).join("")}
  </section>`;
}

// ---------- outcome ----------
function renderOutcome() {
  const docs = [SLOTS.A.doc, SLOTS.B.doc], rules = CONFIG.rules;
  const calc = (doc) => {
    const rows = rowsOf(doc); if (!rows.length) return null;
    const e = rows[rows.length - 1], sum = (k) => rows.reduce((t, r) => t + r[k], 0);
    const college = (doc.children || []).reduce((t, c) => t + c.cost * c.years, 0);
    const gifts = (doc.spendingBands || []).filter((b) => b.kind === "gift").reduce((t, b) => t + b.amount * (b.to - b.from + 1), 0);
    const estateTax = Math.max(0, e.worth - exemption()) * rules.estateRate, heirs = e.pretax * (doc.heirsRate || 0) / 100;
    return { tax: sum("tax"), fed: sum("fed"), gains: sum("gains"), niit: sum("niit"), state: sum("state"), ss: sum("ss"), conv: sum("conv"),
      college, gifts, estate: e.worth, estateTax: -estateTax, heirsTax: -heirs, net: college + gifts + e.worth - estateTax - heirs };
  };
  const [oa, ob] = docs.map((d) => d && calc(d));
  docs.forEach((d) => d && loadSummary(d.id));
  if (!oa || (two() && !ob)) return `<section class="panel outcome" aria-label="Outcome over the whole plan"><b>Outcome over the whole plan</b><div class="empty">Waiting for Owl…</div></section>`;
  const OUT = [["Taxes paid", "tax", 0, 1], ["Federal income tax", "fed", 1], ["Capital gains tax", "gains", 1], ["Investment income tax", "niit", 1], ["State tax", "state", 1],
    ["Social Security received", "ss", 0], ["Converted to Roth", "conv", 0],
    ["To the children", "net", 0, 1], ["College", "college", 1], ["Gifts while alive", "gifts", 1], ["Estate at the end", "estate", 1], ["Estate tax", "estateTax", 1], ["Income tax they owe on inherited pre-tax", "heirsTax", 1]];
  return `<section class="panel outcome" aria-label="Outcome over the whole plan">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><b>Outcome over the whole plan</b><span class="muted small">Today's dollars, added up over every year</span></div>
    <div style="overflow-x:auto"><table><tbody>
      ${OUT.map(([label, key, sub, head]) => `<tr class="${head ? "head" : ""}"><th class="l ${sub ? "sub" : ""}">${label}</th><td class="tA">${money(oa[key])}</td>${ob ? `<td class="tB">${money(ob[key])}</td>` : ""}</tr>`).join("")}
      ${acrossRows(two() ? docs : [docs[0]])}
    </tbody></table></div>
    <div class="muted small">Estate tax: ${Math.round(rules.estateRate * 100)}% above ${money(exemption())}${people().length > 1 ? " for a couple" : ""}. Gifts and college are counted as paid, not grown. Real estate counts at today's value.</div>
  </section>`;
}

// ---------- Risk Analysis results in View ----------
// Headline numbers of the analyses already saved for a plan, fetched once and kept until it changes.
const SUMMARY = {};
async function loadSummary(id) {
  if (!id || id in SUMMARY) return;
  SUMMARY[id] = null;   // loading
  try { SUMMARY[id] = (await api("GET", `/api/scenarios/${id}/risk-summary`)).data; } catch (err) { SUMMARY[id] = []; }
  const old = document.querySelector("section.outcome");
  if (old && UI.page === "compare" && !UI.editing) old.outerHTML = renderOutcome();
}
// The lines shown, in this order; a line appears when either plan has it, real history always.
const ACROSS = [
  ["left", "history", false, "Real history: lasted"], ["left", "random", false, "Random history: lasted"],
  ["left", "random", true, "Random history, life-table lifespans: lasted"], ["left", "garch_dcc", false, "Calm and stormy spells: lasted"],
  ["left", "garch_dcc", true, "Calm and stormy spells, life-table lifespans: lasted"],
  ["spend", "history", false, "Spending that works in 9 of 10 histories · Perch"], ["owl-frontier", "history", false, "Spending that works in 9 of 10 histories · Owl"],
];
function acrossRows(docs) {
  const sums = docs.map((d) => d && SUMMARY[d.id]);
  const find = (sum, [m, k, l]) => (sum || []).find((r) => r.measure === m && r.kind === k && r.life === l);
  const cell = (slot, doc, sum, line) => {
    if (!doc) return "";
    const r = find(sum, line), [m, k, l] = line;
    const go = `data-act="riskOpen" data-slot="${slot}" data-m="${m}" data-k="${k}" data-l="${l ? 1 : 0}"`;
    let text;
    if (sum == null) text = `<span class="muted">…</span>`;
    else if (!r) text = `<button type="button" class="linkish muted" ${go}>not run yet</button>`;
    else {
      const v = m === "left" ? `${r.lasted} of ${r.total} · P10 ${money(r.p10)}` : `${money(r.safe90)} a year`;
      text = `<button type="button" class="linkish ${r.stale ? "muted" : ""}" ${go} title="${r.stale ? "Run before the plan changed" : "Open in Risk Analysis"}">${v}${r.stale ? " · out of date" : ""}</button>`;
    }
    return `<td class="t${slot}">${text}</td>`;
  };
  const lines = ACROSS.filter((line, i) => i === 0 || sums.some((sum) => find(sum, line)));
  return `<tr class="head"><th class="l">Across markets <span class="muted small">(Risk Analysis)</span></th>${docs.map((d, i) => d ? `<td></td>` : "").join("")}</tr>`
    + lines.map((line) => `<tr><th class="l sub">${line[3]}</th>${docs.map((d, i) => cell(i ? "B" : "A", d, sums[i], line)).join("")}</tr>`).join("");
}

// ---------- the year's to-do list ----------
// What each person does in one year of one plan, from Owl's solution. Amounts come in today's
// dollars; `price` turns them into that year's own dollars, which is what a transfer will say.
function todoOf(slot, year) {
  const doc = SLOTS[slot].doc, t = doc && doc.result && doc.result.timeline;
  const r = t && t.find((x) => x.year === year);
  if (!r) return null;
  const prev = t.find((x) => x.year === year - 1);
  const k = UI.dollars === "then" ? (r.price || 1) : 1;
  const $ = (v) => { const x = v * k, step = Math.abs(x) < 10000 ? 10 : 100; return dollars(Math.round(x / step) * step); };
  const steps = [];
  const add = (who, text, note) => steps.push({ who, text, note });
  (r.people || []).forEach((p, i) => {
    const name = (people()[i] || {}).name || "Person " + (i + 1), age = year - ((people()[i] || {}).born || 0);
    const was = prev && prev.people ? prev.people[i] : null;
    if (p.wages > 0) {
      add(name, `Work. Taxable pay about ${$(p.wages)}.`);
      if (p.save[1] > 0) add(name, `Pre-tax 401k: ${$(p.save[1])} goes in, your paycheck savings plus the employer match.`);
      if (p.save[2] > 0) add(name, `Roth 401k: put in ${$(p.save[2])}, including after-tax money moved to Roth inside the plan.`);
      if (p.save[3] > 0) add(name, `HSA: put in ${$(p.save[3])}.`);
      if (p.save[0] > 0) add(name, `Taxable account: put in ${$(p.save[0])}.`);
    }
    if (p.ss > 0 && !(was && was.ss > 0)) add(name, `Start Social Security this year, at ${age}. About ${$(p.ss)} this year.`, "Apply about three months ahead.");
    else if (p.ss > 0) add(name, `Social Security pays about ${$(p.ss)}.`);
    if (p.convert > 0) add(name, `Roth conversion: move ${$(p.convert)} from pre-tax to Roth.`, "It counts as income this year. Do it by 31 December.");
    if (p.required > 0) add(name, `Required withdrawal: take at least ${$(p.required)} out of pre-tax.`, "Required by law from this age. Due by 31 December.");
    const extra = p.pretaxOut - p.required;
    if (extra > 50) add(name, `${p.required > 0 ? "On top of that, take" : "Take"} ${$(extra)} out of pre-tax.`, "Taxed as income.");
    const net = p.sell - p.invest;
    if (net > 50) add(name, `Sell ${$(net)} from the taxable brokerage account.`, p.gain != null && p.sell > 0 ? `About ${$(p.gain * net / p.sell)} of it is gain, taxed as capital gains.` : "");
    else if (net < -50) add(name, `Invest ${$(-net)} of leftover cash in the taxable account.`);
    if (p.rothOut > 50) add(name, `Take ${$(p.rothOut)} out of Roth. Tax-free.`);
    if (p.hsaOut > 50) add(name, `Pay ${$(p.hsaOut)} of medical costs from the HSA. Tax-free.`);
  });
  if (r.insurance > 0) add("Both", `Marketplace health insurance: about ${$(r.insurance)} for the year, after any subsidy.`, "Sign up in open enrollment, each November, for the next year.");
  if (r.medicare > 0) add("Both", `Medicare premiums: about ${$(r.medicare)}.`, "Higher income two years earlier raises them.");
  const bands = extrasOf(doc, year).map((x) => `${x.what} ${$(x.amount)}`);
  add("Both", `Spend about ${$(r.spending)} on living${bands.length ? ", plus " + bands.join(", ") : ""}.`);
  if (r.tax > 0) {
    const parts = [["federal income", r.federal], ["capital gains", r.gainsTax], ["investment income", r.niit], [(HOUSE && HOUSE.state ? HOUSE.state + " " : "state ") + "income", r.state]].filter(([, v]) => v > 50);
    add("Both", `Tax for ${year}: about ${$(r.tax)}, of which ${parts.map(([w, v]) => w + " " + $(v)).join(", ")}.`, "Pay it in quarterly estimates (April, June, September, January), or have it withheld.");
  }
  return { steps, row: r };
}

function yearBody(year) {
  const col = (slot) => {
    const todo = todoOf(slot, year);
    if (!todo) return `<div class="todo"><div class="todo-head">${nameOf(slot)}</div><div class="muted small">No plan for this year.</div></div>`;
    const groups = [];
    todo.steps.forEach((x) => { let g = groups.find((y) => y.who === x.who); if (!g) groups.push(g = { who: x.who, list: [] }); g.list.push(x); });
    return `<div class="todo" style="border-top-color:${COLOR[slot]}"><div class="todo-head">${nameOf(slot)}</div>${groups.map((g) => `<div class="todo-who">${esc(g.who === "Both" ? (people().length > 1 ? "Together" : "Household") : g.who)}</div><ol>${g.list.map((x) => `<li>${esc(x.text)}${x.note ? `<div class="muted small">${esc(x.note)}</div>` : ""}</li>`).join("")}</ol>`).join("")}</div>`;
  };
  const r = (todoOf("A", year) || todoOf("B", year) || {}).row || {};
  const ages = people().map((p) => p.name + " " + (year - p.born)).join(" · ");
  return `<div class="pad">
      <div class="todo-bar">${seg([["today", "Today's dollars"], ["then", year + " dollars"]], "dollars")}<span class="muted small">${UI.dollars === "then" ? `Prices assumed ${((r.price || 1) - 1) * 100 >= 0.5 ? Math.round(((r.price || 1) - 1) * 100) + "% higher than in " + (SLOTS.A.doc || SLOTS.B.doc).planStart : "about the same as today"}. These are the amounts a transfer would show.` : "Prices of 1 January " + (SLOTS.A.doc || SLOTS.B.doc).planStart + ", like the rest of the page."} ${esc(ages)}.</span></div>
      <div class="todo-cols ${two() ? "" : "one"}">${slots().map(col).join("")}</div>
      <p class="muted small">From Owl's solution, rounded. A plan, not advice: check the tax and account steps with your adviser before acting.</p></div>`;
}

function bandsBody(slot) {
  const doc = SLOTS[slot].doc, bands = doc.spendingBands || [], rows = rowsOf(doc);
  const start = doc.planStart, last = rows.length ? rows[rows.length - 1].year : start + 50;
  const W = 1080, L = 56, Rr = 12, T = 12, CH = 240, years = [];
  for (let y = start; y <= last; y++) years.push(y);
  const cw = (W - L - Rr) / years.length, bw = Math.max(2, cw - 2), baseOf = {};
  rows.forEach((r) => { baseOf[r.year] = r.spend; });
  const colorOf = (x) => x.kind === "mortgage" ? "#8f7fe0" : x.kind === "college" ? "#c98500" : BAND_COLORS[x.band % BAND_COLORS.length];
  const parts = (y) => [{ what: "Base", amount: baseOf[y] != null ? baseOf[y] : doc.netSpending, color: "#5a5c62" }].concat(extrasOf(doc, y).map((x) => Object.assign(x, { color: colorOf(x) })));
  let peak = 1; years.forEach((y) => { peak = Math.max(peak, parts(y).reduce((t, p) => t + p.amount, 0)); });
  const stp = niceStep(peak), ymx = Math.ceil(peak / stp) * stp, yv = (v) => T + CH * (1 - v / ymx);
  let bars = "", grid = "", xt = "", lanes = "";
  years.forEach((y, i) => { let acc = 0; parts(y).forEach((p) => { bars += `<rect x="${(L + i * cw + 1).toFixed(1)}" y="${(yv(acc + p.amount) + 1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, yv(acc) - yv(acc + p.amount) - 1).toFixed(1)}" fill="${p.color}"><title>${esc(y + " · " + p.what + " · " + dollars(p.amount))}</title></rect>`; acc += p.amount; }); });
  for (let v = 0; v <= ymx + 1; v += stp) grid += `<line x1="${L}" x2="${W - Rr}" y1="${yv(v).toFixed(1)}" y2="${yv(v).toFixed(1)}" stroke="#2a2c31"/><text x="${L - 8}" y="${(yv(v) + 4).toFixed(1)}" text-anchor="end">${v === 0 ? "$0" : money(v)}</text>`;
  years.forEach((y, i) => { if (y % 5 === 0) xt += `<text x="${(L + i * cw + cw / 2).toFixed(1)}" y="${T + CH + 16}" text-anchor="middle">${y}</text>`; });
  const lanesTop = T + CH + 30;
  bands.forEach((b, i) => {
    const x1 = L + (Math.max(b.from, start) - start) * cw, x2 = L + (Math.min(b.to, last) - start + 1) * cw, ly = lanesTop + i * 24, c = BAND_COLORS[i % BAND_COLORS.length];
    lanes += `<text x="${L - 8}" y="${ly + 13}" text-anchor="end">${i + 1}</text><rect x="${x1.toFixed(1)}" y="${ly}" width="${Math.max(4, x2 - x1).toFixed(1)}" height="18" rx="4" fill="${c}"><title>${esc(b.name)}</title></rect>`
      + `<rect class="handle" x="${x1.toFixed(1)}" y="${ly}" width="6" height="18" rx="2" fill="#f0efec" data-drag="from" data-i="${i}"><title>Drag to change the first year</title></rect>`
      + `<rect class="handle" x="${(x2 - 6).toFixed(1)}" y="${ly}" width="6" height="18" rx="2" fill="#f0efec" data-drag="to" data-i="${i}"><title>Drag to change the last year</title></rect>`;
  });
  const legend = [["Base", "#5a5c62"], ["Mortgage", "#8f7fe0"], ["College", "#c98500"]].concat(bands.map((b, i) => [(i + 1) + " · " + b.name, BAND_COLORS[i % BAND_COLORS.length]]));
  const spec = CONFIG.lists.spendingBands, fld = (k) => spec.fields.find((f) => f.key === k);
  const lifetime = bands.reduce((t, b) => t + b.amount * (b.to - b.from + 1), 0);
  return `<div class="pad" style="display:flex;flex-direction:column;gap:10px">
      <div class="legend" style="margin-left:0">${legend.map(([l, c]) => `<span><span class="chip" style="background:${c}"></span>${esc(l)}</span>`).join("")}</div>
      <svg class="chart" id="bands-svg" data-slot="${slot}" data-l="${L}" data-cw="${cw}" data-start="${start}" data-last="${last}" viewBox="0 0 ${W} ${lanesTop + bands.length * 24 + 6}" role="img" aria-label="Spending per year by kind" style="touch-action:none">${grid}${bars}${xt}${lanes}</svg>
      <div class="muted small">Drag a band's ends to change its years. ${people().length > 1 ? "Base is what Owl spends after the survivor adjustment." : "Base is what Owl spends each year."} Mortgage and college come from Real estate and Children. Bands that grow like health costs rise faster than prices by the Health setting.</div>
    </div>

    [`Best January amount for ${esc(name)}, with hindsight`, money(xs.median), `Middle history. The lowest tenth of histories are below ${money(xs.p10)}, the highest tenth above ${money(xs.p90)}`],
    ["Safe in every history", safe.length ? "up to " + money(Math.max(...safe)) : "—", "No history runs short"],
    ["Owl's verdict on a best amount", sm.valley_resolvable ? money(sm.valley.x) : "none stands out", sm.valley_resolvable ? `Range ${money(sm.valley_ci.p10)}–${money(sm.valley_ci.p90)}` : `Differences are smaller than the noise in Owl's own answers (${money(sm.resolution_floor)})`],
  ].map(([t, v, sub]) => `<div class="tile"><div class="muted small">${t}</div><div class="big mono">${v}</div><div class="muted small">${sub}</div></div>`).join("");
  const table = `<table class="regret"><thead><tr><th>Locked in January</th><th>Typical cost</th><th>P90 cost</th><th>Worst cost</th><th>Histories that run short</th></tr></thead><tbody>${rows.map((r) => `<tr><td class="mono">${money(r.x)}</td><td class="mono">${money(r.median)}</td><td class="mono">${money(r.p90)}</td><td class="mono">${money(r.max)}</td><td>${r.n_infeasible ? `<span class="short">${r.n_infeasible}</span>` : '<span class="muted">none</span>'}</td></tr>`).join("")}</tbody></table>`;

    ${table}
    <p class="risk-lead">Costs are against Owl's own hindsight plan for each history. Owl's answers are approximate, so in some histories a locked amount did slightly better than hindsight; Owl measures that noise and says when a best amount cannot be told apart from it. Owl's average cost is left out here because a few such histories swing it.</p>`;
}

// This year's conversion: what locking the first year's amount costs against hindsight.
function regretBody(data, color) {
  const free = {}; data.free.forEach((r) => { free[r.start] = r; });
  const usable = data.free.filter((r) => r.solved && r.convergence !== "unsolvable iterate");
  const rows = data.grid.map((g) => {
    const cells = data.locked.filter((r) => r.locked === g && free[r.start] && free[r.start].solved && free[r.start].convergence !== "unsolvable iterate");
    const short = cells.filter((r) => !r.solved).map((r) => r.start);
    // A locked amount can end slightly better than hindsight, since Owl's answers are approximate;
    // those are counted as they are, not rounded to zero.
    const costs = cells.filter((r) => r.solved).map((r) => free[r.start].left - r.left).sort((a, b) => a - b);
    return { g, short, mean: quantile(costs, 0.5) || 0, bad: quantile(costs, 0.9) || 0, worst: costs[costs.length - 1] || 0, better: costs.filter((v) => v < -1000).length };
  });
  const safe = rows.filter((r) => !r.short.length).map((r) => r.g), safeAll = safe.filter((g) => rows.filter((r) => r.g <= g).every((r) => !r.short.length)), safeTop = safeAll.length ? Math.max(...safeAll) : null;
  const plan = rows.find((r) => r.g === Math.round(data.planFirst / 1000) * 1000) || rows.reduce((a, b) => (Math.abs(b.g - data.planFirst) < Math.abs(a.g - data.planFirst) ? b : a));
  const best = usable.map((r) => r.first).sort((a, b) => a - b);
  const tiles = [
    [`The plan converts for ${esc(data.name)}`, money(data.planFirst), plan.short.length ? `Runs short in ${plan.short.length} of ${usable.length} histories: ${plan.short.join(", ")}` : `Lasts in all ${usable.length} histories`],
    ["Safe in every history", safeTop == null ? "—" : "up to " + money(safeTop), "No history runs short"],
    ["Hindsight's best, middle history", money(quantile(best, 0.5)), `Half fall between ${money(quantile(best, 0.25))} and ${money(quantile(best, 0.75))}`],
    ["Typical cost of the plan's amount", money(plan.mean), `P90: ${money(plan.bad)}`],
  ].map(([t, v, sub]) => `<div class="tile"><div class="muted small">${t}</div><div class="big mono">${v}</div><div class="muted small">${sub}</div></div>`).join("");
  const table = `<table class="regret"><thead><tr><th>Locked in January</th><th>Typical cost</th><th>P90 cost</th><th>Worst cost</th><th>Better than hindsight</th><th>Histories that run short</th></tr></thead><tbody>${rows.map((r) => `<tr class="${r === plan ? "on" : ""}"><td class="mono">${money(r.g)}${r === plan ? " · the plan" : ""}</td><td class="mono">${money(r.mean)}</td><td class="mono">${money(r.bad)}</td><td class="mono">${money(r.worst)}</td><td class="mono">${r.better || ""}</td><td>${r.short.length ? `<span class="short">${r.short.length}</span> <span class="muted small">${r.short.join(", ")}</span>` : '<span class="muted">none</span>'}</td></tr>`).join("")}</tbody></table>`;
  return `<div class="tiles">${tiles}</div>
    <div class="chart-head"><span>What locking ${esc(data.name)}'s January conversion costs, in money left at the end (today's dollars)</span><span class="muted">${usable.length} of ${data.free.length} histories; borderline and short ones left out</span></div>
    ${table}
    <p class="risk-lead">A history that runs short with a large January conversion is one where markets fall soon after: the conversion's tax is paid with money the plan later needs. Converting part in January and the rest late in the year, once the year's markets are known, avoids that.</p>`;
}

// The markets one path lived through: stocks each year as bars, inflation as a line, on the
// same years as the chart above. Returns are Owl's, in percent: stocks, corporate bonds, T-notes, inflation.
// It always takes the same space, so picking a path does not move the page.
function returnsPanel(sel, x0, x1, L, pw) {
  const W = 1200, H = 120;
  const empty = (text) => `<div class="fan-read rline"><span class="muted">${text}</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="No path picked"></svg>`;
  if (!sel) return empty("Markets of the picked path: stocks each year (bars) and inflation (line).");
  const rows = (sel.returns || []).filter((r) => r[0] >= x0 && r[0] <= x1);
  if (!rows.length) return empty("This run is from before paths kept their markets; run it again to see each path's returns.");
  // On real history, the plan's year and the market year it replays.
  const first = (sel.returns || [])[0][0], when = (yr) => UI.riskKind === "history" ? `${yr} (${sel.value + yr - first}'s markets)` : String(yr);
  const T = 14, B = 26, ph = H - T - B, Rr = 12;
  const x = (yr) => L + (yr - x0) * pw / Math.max(1, x1 - x0), cw = pw / Math.max(1, x1 - x0);
  const hi = Math.max(10, ...rows.map((r) => Math.max(r[1], r[4]))), lo = Math.min(-10, ...rows.map((r) => Math.min(r[1], r[4])));
  const y = (v) => T + ph * (hi - v) / (hi - lo);
  let svg = [lo, 0, hi].map((v) => Math.round(v)).filter((v, i, a) => a.indexOf(v) === i).map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${v === 0 ? "#5a5c62" : "#2a2c31"}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}%</text>`).join("");
  rows.forEach((r) => {
    const top = Math.min(y(r[1]), y(0)), h = Math.max(1, Math.abs(y(r[1]) - y(0)));
    svg += `<rect x="${(x(r[0]) - cw * 0.35).toFixed(1)}" y="${top.toFixed(1)}" width="${(cw * 0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${r[1] < 0 ? "#e5484d" : "#6f9fd8"}" fill-opacity="0.85"><title>${when(r[0])}: stocks ${r[1].toFixed(1)}%, bonds ${r[2].toFixed(1)}%, inflation ${r[4].toFixed(1)}%</title></rect>`;
  });
  svg += `<path d="${rows.map((r, k) => `${k ? "L" : "M"}${x(r[0]).toFixed(1)},${y(r[4]).toFixed(1)}`).join("")}" fill="none" stroke="#e0b04a" stroke-width="2"/>`;
  for (let yr = x0; yr <= x1; yr++) if (yr % 5 === 0) svg += `<text x="${x(yr).toFixed(1)}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
  const avg = (k) => (Math.pow(rows.reduce((t, r) => t * (1 + r[k] / 100), 1), 1 / rows.length) - 1) * 100;
  const worst = rows.reduce((m, r) => (r[1] < m[1] ? r : m), rows[0]), best = rows.reduce((m, r) => (r[1] > m[1] ? r : m), rows[0]);
  const down = rows.filter((r) => r[1] < 0).length;
  return `<div class="fan-read rline"><span class="muted">Markets: stocks (bars), inflation (line)</span><span>stocks averaged <b class="mono">${avg(1).toFixed(1)}%</b> a year</span><span>worst year <b class="mono">${worst[1].toFixed(0)}%</b> in ${when(worst[0])}</span><span>best <b class="mono">+${best[1].toFixed(0)}%</b> in ${when(best[0])}</span><span>${down} losing years of ${rows.length}</span><span>bonds averaged <b class="mono">${avg(2).toFixed(1)}%</b></span><span>inflation averaged <b class="mono">${avg(4).toFixed(1)}%</b></span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stock returns and inflation each year on this path" data-x0="${x0}" data-x1="${x1}" data-l="${L}" data-pw="${pw}">${svg}</svg>`;
}

// A path that ran short: when the money runs out, found on request (Owl returns no plan for it).
function runoutText(sel) {
  const r = sel.runout;
  if (!r) return "· the money runs out in these markets; the button on the chart finds when";
  if (!r.lastYear) return `· the money runs out before ${r.before}, the year the first of you reaches Medicare age (Owl cannot plan for a shorter span, so Perch cannot narrow it further)`;
  const ages = people().map((p) => `${esc(p.name)} ${r.lastYear - p.born}`).join(", ");
  return `· the money pays for everything through <b>${r.lastYear}</b> (${ages}), then the savings run out (the home is not sold)${r.convergence === "unsolvable iterate" ? "; give or take a year, as Owl's answer near the edge is approximate" : ""}`;
}

// Safe spending: for each path, the most base spending it could pay every year.
function spendBody(data, color, doc) {

  const affords = (g) => ok.filter((p) => p.spending >= g).length;

    ["Works in every path", money(sp[0]), ok.length < n ? `of the ${ok.length} Owl could solve` : `Lowest: ${esc((ok.find((p) => p.spending === sp[0]) || {}).label || "")}`],
    ["Median", money(quantile(sp, 0.5)), `Highest ${money(sp[sp.length - 1])}`],
  ].map(([t, v, sub]) => `<div class="tile"><div class="muted small">${t}</div><div class="big mono">${v}</div><div class="muted small">${sub}</div></div>`).join("");

  // Share of paths that can afford each spending level: a falling curve.
  const W = 1200, H = 300, L = 64, Rr = 12, T = 12, B = 30, pw = W - L - Rr, ph = H - T - B;
  const step = niceStep(sp[sp.length - 1] - Math.min(sp[0], plan) || 1);
  const g0 = Math.floor(Math.min(sp[0], plan) * 0.9 / step) * step, g1 = Math.ceil(sp[sp.length - 1] * 1.02 / step) * step;
  const x = (g) => L + (g - g0) * pw / Math.max(1, g1 - g0), y = (f) => T + ph * (1 - f);
  let grid = [0, 0.25, 0.5, 0.75, 0.9, 1].map((f) => `<line x1="${L}" x2="${W - Rr}" y1="${y(f).toFixed(1)}" y2="${y(f).toFixed(1)}" stroke="${f === 0.9 ? "#3a3c42" : "#2a2c31"}"/><text x="${L - 6}" y="${(y(f) + 4).toFixed(1)}" text-anchor="end">${Math.round(f * 100)}%</text>`).join("");
  for (let g = g0; g <= g1 + 1; g += step) grid += `<text x="${x(g).toFixed(1)}" y="${H - 8}" text-anchor="${g + step > g1 + 1 ? "end" : "middle"}">${money(g)}</text>`;
  let d = "", prev = null;
  for (let g = g0; g <= g1; g += Math.max(1, g1 - g0) / 300) { const f = affords(g) / n; d += `${prev == null ? "M" : "L"}${x(g).toFixed(1)},${y(f).toFixed(1)}`; prev = f; }
  const planX = x(plan).toFixed(1), planF = affords(plan) / n;
  const curve = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of paths that can afford each level of spending">${grid}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>
    <line x1="${planX}" x2="${planX}" y1="${T}" y2="${T + ph}" stroke="#f0efec" stroke-dasharray="5 4"/>
    <circle cx="${planX}" cy="${y(planF).toFixed(1)}" r="5" fill="#f0efec"/>
    <text x="${(+planX + 8).toFixed(1)}" y="${(y(planF) - 8).toFixed(1)}" style="fill:#f0efec">The plan: ${Math.round(planF * 100)}% of paths</text></svg>`;

  const order = UI.riskKind === "history" ? paths : paths.slice().sort((a, b) => (a.spending ?? -1) - (b.spending ?? -1));
  const top = Math.ceil(sp[sp.length - 1] * 1.05 / step) * step, by = (v) => bT + bph * (1 - v / top), slotW = pw / order.length;
  let bars = [0, top / 4, top / 2, (3 * top) / 4, top].map((v) => `<line x1="${L}" x2="${BW - Rr}" y1="${by(v).toFixed(1)}" y2="${by(v).toFixed(1)}" stroke="#2a2c31"/><text x="${L - 6}" y="${(by(v) + 4).toFixed(1)}" text-anchor="end">${money(v)}</text>`).join("");
  order.forEach((p, i) => {
    const cx = L + slotW * i + slotW / 2, w = Math.max(2, slotW - 3), on = p.value === UI.riskPath;
    const v = p.solved ? p.spending : 0, low = v < plan;
    const fill = on ? "#6fc2b5" : !p.solved ? "#6f7278" : p.convergence === "unsolvable iterate" ? "#d9a13b" : low ? "#e5484d" : color;
    bars += `<g data-act="riskPath" data-v="${p.value}" style="cursor:pointer"><rect x="${(cx - slotW / 2).toFixed(1)}" y="${bT}" width="${slotW.toFixed(1)}" height="${bph + 4}" fill="transparent"/>`
      + `<rect x="${(cx - w / 2).toFixed(1)}" y="${by(Math.max(v, top * 0.02)).toFixed(1)}" width="${w.toFixed(1)}" height="${(base - by(Math.max(v, top * 0.02))).toFixed(1)}" rx="2" fill="${fill}" fill-opacity="${on ? 1 : 0.85}"/>`
      + `<title>${esc(p.label + ": " + (p.solved ? "can spend " + money(v) + " a year" : "Owl could not solve"))}</title></g>`;
    if (UI.riskKind === "history" && p.value % 10 === 0) bars += `<text x="${cx.toFixed(1)}" y="${BH - 8}" text-anchor="middle">${p.value}</text>`;
  });
  bars += `<line x1="${L}" x2="${BW - Rr}" y1="${by(plan).toFixed(1)}" y2="${by(plan).toFixed(1)}" stroke="#f0efec" stroke-dasharray="5 4"/><text x="${BW - Rr}" y="${(by(plan) - 6).toFixed(1)}" text-anchor="end" style="fill:#f0efec">The plan: ${money(plan)}</text>`;
  const detail = sel ? `<div class="risk-path"><b style="color:#6fc2b5">${esc(sel.label)}</b>${sel.lifespans && riskLife() ? " · " + people().map((x, i) => esc(x.name) + " lives to " + sel.lifespans[i]).join(", ") : ""} · ${sel.solved ? `can pay <b class="mono">${money(sel.spending)}</b> a year${sel.spending < plan ? `, ${money(plan - sel.spending)} less than the plan` : ""}${sel.convergence === "unsolvable iterate" ? " (borderline: Owl could not fully settle this answer)" : ""}` : "Owl could not solve this path"} <button type="button" data-act="riskPath" data-v="${sel.value}">Clear</button></div>` : `<div class="risk-path muted small">Click a bar to see that path.</div>`;
  return `<div class="tiles">${tiles}</div>
    <div class="chart-head"><span>Share of paths that can pay each level of base spending, every year</span>${unsettled.length ? `<span class="muted">${unsettled.length} borderline</span>` : ""}</div>
    ${curve}
